[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-traffic-rl"
version = "0.1.0"
description = "Adaptive traffic-signal control with Gymnasium and DQN"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "gymnasium>=1.0,<2.0",
  "stable-baselines3>=2.4,<3.0",
  "torch>=2.3,<3.0",
  "numpy>=1.26,<3.0",
  "pandas>=2.1,<4.0",
  "matplotlib>=3.8,<4.0",
  "pygame>=2.5,<3.0",
  "tensorboard>=2.16,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.setuptools.packages.find]
include = ["traffic_rl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
